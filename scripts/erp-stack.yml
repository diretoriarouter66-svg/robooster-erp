version: "3.8"

services:
  erp:
    image: robooster-erp:latest
    networks:
      - robooster_net
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      labels:
        - traefik.enable=true
        - traefik.docker.network=robooster_net
        - traefik.http.routers.robooster_erp.rule=Host(`erp.robooster.com.br`)
        - traefik.http.routers.robooster_erp.entrypoints=websecure
        - traefik.http.routers.robooster_erp.tls=true
        - traefik.http.routers.robooster_erp.tls.certresolver=letsencryptresolver
        - traefik.http.services.robooster_erp.loadbalancer.server.port=80

networks:
  robooster_net:
    external: true
